name: DemoDriver
options: { deploymentTarget: { iOS: "27.0" } }
settings: { base: { SWIFT_VERSION: "6.0", CODE_SIGN_STYLE: Automatic, DEVELOPMENT_TEAM: SZVSSCJQFN, GENERATE_INFOPLIST_FILE: YES } }
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.ideahelix.demohost, INFOPLIST_KEY_UILaunchScreen_Generation: YES } }
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: Host }]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.ideahelix.demouitests, TEST_TARGET_NAME: Host } }
schemes:
  Driver:
    build: { targets: { Host: all, UITests: [test] } }
    test: { targets: [UITests] }
